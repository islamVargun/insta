name: Instagram Bot Automation

on:
  schedule:
    - cron: '0 8 * * *' # Her sabah saat 08:00'da çalışır (UTC)
  workflow_dispatch: # Manuel olarak da çalıştırabilmek için

jobs:
  fetch-posts:
    runs-on: ubuntu-latest
    
    steps:
      - name: Repoyu Çek (Checkout)
        uses: actions/checkout@v4
        
      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install apify-client requests python-dotenv google-genai pillow
          
      - name: Botu Çalıştır ve Verileri Güncelle
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot/fetch_posts.py
        
      - name: Değişiklikleri İşle (Commit & Push)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add src/data/posts.json public/images/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Bot: Yeni Instagram gönderileri eklendi" && git push)
